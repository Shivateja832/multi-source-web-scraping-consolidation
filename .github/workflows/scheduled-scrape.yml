name: Scheduled scraper and public results

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Check directories
        run: python healthcheck.py
      - name: Build production container
        run: docker build --tag multi-source-scraper:${{ github.sha }} .
      - name: Scrape public sources in container
        env:
          OUTPUT_DIR: ${{ runner.temp }}/scraper-output
          LOG_DIR: ${{ runner.temp }}/scraper-logs
          MAX_RETRIES: "3"
          RATE_LIMIT_DELAY_SECONDS: "1"
          REQUEST_TIMEOUT: "25"
        run: |
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"
          mkdir -p "$OUTPUT_DIR" "$LOG_DIR"
          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --memory 512m \
            --cpus 1 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$OUTPUT_DIR,dst=/app/output" \
            --mount "type=bind,src=$LOG_DIR,dst=/app/logs" \
            multi-source-scraper:${{ github.sha }}
      - name: Validate outputs and source URLs
        run: python healthcheck.py --require-output
      - name: Build public results page
        run: python publish_site.py
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/scraper-output/summary_report.json
            ${{ runner.temp }}/scraper-logs/pipeline.log
          if-no-files-found: warn
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public results page
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful deployment
        if: success()
        run: |
          echo "Scrape and public results deployment completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Published URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve open scraper alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[Scraper alert] Scheduled run failed";
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = openIssues.find((item) => !item.pull_request && item.title === title);
            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `Recovered successfully in run ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
              });
            }
      - name: Open or update scraper alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[Scraper alert] Scheduled run failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Scheduled scrape or deployment failed.\n\n- Run: ${runUrl}\n- Branch: ${context.ref}\n- Commit: ${context.sha}\n\nReview the workflow steps and logs. This issue will be updated on subsequent failures and closed after a successful run.`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = openIssues.find((item) => !item.pull_request && item.title === title);
            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
      - name: Record failed run
        if: failure()
        run: |
          echo "Scrape or deployment failed. Review this workflow run and enable GitHub Actions failure notifications in repository settings." >> "$GITHUB_STEP_SUMMARY"
