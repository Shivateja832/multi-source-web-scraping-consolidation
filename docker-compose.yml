services:
  scraper:
    build: .
    init: true
    read_only: true
    restart: "on-failure:3"
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      REQUEST_TIMEOUT: 20
      MAX_RETRIES: 3
      RATE_LIMIT_DELAY_SECONDS: 0.5
      DEFAULT_PAGE_LIMIT: 0
      OUTPUT_DIR: /app/output
      LOG_DIR: /app/logs
      BOOKS_BASE_URL: https://books.toscrape.com/
      QUOTES_BASE_URL: https://quotes.toscrape.com/
    volumes:
      - scraper-output:/app/output
      - scraper-logs:/app/logs
    command: python main.py

volumes:
  scraper-output:
  scraper-logs:
